name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Development value for CI only; production generates its own (see README).
  AUTH_SECRET: ci-only-auth-secret-not-used-in-production
  DATABASE_URL: file:./data/ci.db

jobs:
  quality:
    name: Lint, typecheck, unit + integration tests, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (runs prisma generate)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Integration tests (SQLite, real migrations, multi-process stock race)
        run: npm run test:integration

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (production build, demo payment provider)
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  docker:
    name: Docker image builds and boots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t carsi-eticaret:ci .
      - name: Start container and wait for /api/health
        run: |
          docker run -d --name carsi-ci -p 5309:10000 carsi-eticaret:ci
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5309/api/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs carsi-ci
          exit 1
      - name: Stop container
        if: always()
        run: docker rm -f carsi-ci || true
