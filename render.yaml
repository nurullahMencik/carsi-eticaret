# Example Render Blueprint for Çarşı (free web service, Docker).
# The demo needs no secrets: AUTH_SECRET is generated by Render, payments use the demo
# provider and e-mails are only logged unless the optional keys below are set.
services:
  - type: web
    name: carsi-eticaret
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: AUTH_SECRET
        generateValue: true
      - key: DEMO_LOGIN_ENABLED
        value: "true"
      # SITE_URL is optional: RENDER_EXTERNAL_URL is used when it is not set.
      # Optional integrations (leave unset for the demo):
      - key: IYZICO_API_KEY
        sync: false
      - key: IYZICO_SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
